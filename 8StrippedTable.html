<html><head>
<title>Stripped-Table</title>
<style>
#table{
  border-collapse: collapse;
  width:100%;
  font-family: sans-serif;
}
th{
  padding:20px 0px;
  color:white;
  background-color:#b22222;
  border: 1px solid grey;
}
tr:nth-child(even){
  background-color:#f2f2f2;
}
tr:hover{
  background-color: burlywood;
}
td{
  padding: 8px;
  border: 1px solid grey;
}
</style></head>
<body>
<table id="table">
<tr><th>Sl no.</th><th>Name</th><th>Age</th></tr>
<tr><td>1</td><td>Sajeeh</td><td>23</td></tr>
<tr><td>2</td><td>Aqif</td><td>25</td></tr>
<tr><td>3</td><td>Anees</td><td>25</td></tr>
<tr><td>4</td><td>Sreehari</td><td>20</td></tr>
<tr><td>5</td><td>Neeraj</td><td>50</td></tr>
</table>
</body>
</html>
