<html>
<body>
<h2>String Object functions</h2>
<script>
let str="Hello World";
document.write("Original string : "+ str +"<br>");
document.write("Length : "+str.length+"<br>");
document.write("Uppercase : "+ str.toUpperCase() +"<br>");
document.write("Lowercase : "+ str.toLowerCase() +"<br>");
document.write("Character at index 1 : "+ str.charAt(1) +"<br>");
document.write("Position of 'W' : "+ str.indexOf("W") +"<br>");
document.write("Extracted string : "+ str.slice(6,11) +"<br>");
document.write("Replace world : "+ str.replace("World","JS") +"<br>");
</script><br>
<h2>Math Object functions</h2>
<script>
let num=5.4;
document.write("Number : "+ num +"<br>");
document.write("Round : "+ Math.round(num) +"<br>");
document.write("Ceil : "+ Math.ceil(num) +"<br>");
document.write("Floor : "+ Math.floor(num) +"<br>");
document.write("Square root(25) : "+ Math.sqrt(25) +"<br>");
document.write("Power(5^3) : "+ Math.pow(5,3) +"<br>");
document.write("Absolute value(-10) : "+ Math.abs(-10) +"<br>");
document.write("Maximum (10,20,30) : "+ Math.max(10,20,30) +"<br>");
document.write("Minimum (10,20,30) : "+ Math.min(10,20,30) +"<br>");
document.write("Random no. : "+ Math.random() +"<br>");
document.write("Pi : "+ Math.PI +"<br>");
</script>
</body>
</html>
